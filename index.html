<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rahul Rachuri — moved to rachuri.me</title>

    <!--
      This page replaces the old single-page site at rahulrachuri.github.io.

      GitHub Pages cannot issue a real 301 — it serves static files and nothing
      else — so the redirect has to be done three ways at once, weakest last:

        1. location.replace() fires first and leaves no history entry, so Back
           goes where the reader came from rather than bouncing them forward
           again. This is what almost everyone actually gets.
        2. The meta refresh at 0 seconds covers scripting being off. Google
           treats a 0-second refresh as a permanent redirect, which matters
           because this URL is cited in papers and on profiles.
        3. rel=canonical tells every crawler which URL is the real one even if
           it declines to follow either of the above.

      The visible link is the floor: if all three fail, the reader still has
      somewhere to click rather than a blank page.
    -->
    <link rel="canonical" href="https://rachuri.me/" />
    <meta http-equiv="refresh" content="0; url=https://rachuri.me/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #fff;
        color: #000;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        text-align: center;
      }
      a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #fff;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <p>This site has moved to <a href="https://rachuri.me/">rachuri.me</a>.</p>
      <p>Taking you there now.</p>
    </main>

    <script>
      // replace(), not assign() — a redirect should not add a history entry.
      location.replace('https://rachuri.me/');
    </script>
  </body>
</html>
